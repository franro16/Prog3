<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservar Turno - Sistema Médico</title>

    <link rel="stylesheet" href="./.css/Gral.css" />
</head>

<body>

    <a id="logoutBtn">
        <button class="secundario">Cerrar sesión</button>
    </a>

    <main>

        <h2 id="welcomeName">Bienvenido/a</h2>

        <!-- Contenedor de alertas -->
        <div id="alertContainer"></div>

        <h3>Reservar un turno</h3>

        <form id="reserveForm">

            <div class="form-group">
                <label for="selectDoctor">Seleccione un médico</label>
                <select id="selectDoctor" required></select>
            </div>

            <div class="form-group">
                <label for="date">Seleccione la fecha</label>
                <input type="date" id="date" required />
            </div>

            <div class="form-group">
                <label for="time">Seleccione un horario</label>
                <select id="time" required></select>
            </div>

            <button type="submit">Solicitar turno</button>

        </form>

        <h3 style="margin-top: 25px;">Mis turnos</h3>

        <div id="misTurnos"></div>

    </main>

<script src=".js/user.js"></script>



</body>

</html>
