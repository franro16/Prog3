<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservar Turno - Sistema Médico</title>
    <link rel="stylesheet" href="./.css/Gral.css" />
    <link rel="stylesheet" href="./.css/user.css" />
</head>

<body>
    <div class="logo-container">
        <img src="Resources/utn-logo.png" alt="Logo de la Clínica" class="app-logo">
    </div>

    <!-- BLOQUE: Control de sesión -->
    <script>
        try {
            const usuarioActual = JSON.parse(sessionStorage.getItem("usuario"));

            if (!usuarioActual || usuarioActual.rol !== "paciente") {
                window.location.href = "index.html";
            }
        } catch (error) {
            window.location.href = "index.html";
        }
    </script>

    <!-- HEADER: Botón de cerrar sesión -->
    <header>
        <a id="logoutBtn">
            <button class="secundario">Cerrar sesión</button>
        </a>
    </header>

    <main>
        <!-- Nombre del usuario logueado -->
        <h2 id="welcomeName">Bienvenido/a</h2>

        <!-- Contenedor de alertas dinámicas -->
        <div id="alertContainer"></div>

        <h3>Reservar un turno</h3>

        <!-- FORMULARIO: Solicitud de turno -->
        <form id="reserveForm">

            <div class="form-group">
                <label for="selectDoctor">Seleccione un médico</label>
                <select id="selectDoctor" required></select>
            </div>

            <div class="form-group">
                <label for="date">Seleccione la fecha</label>
                <input type="date" id="date" required />
            </div>

            <div class="form-group">
                <label for="time">Seleccione un horario</label>
                <select id="time" required>
                    <option value="">Seleccione hora</option>
                </select>
            </div>

            <button type="submit">Solicitar turno</button>
        </form>

        <hr>

        <h3>Mis Turnos</h3>

        <!-- Contenedor dinámico para los turnos del paciente -->
        <div id="misTurnos" class="turnos-container"></div>
    </main>

    <!-- Script principal del usuario -->
    <script src="./.js/user.js"></script>
</body>

</html>
