<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservar Turno - Sistema Médico</title>

    <link rel="stylesheet" href="./.css/Gral.css" />
    <link rel="stylesheet" href="./.css/user.css" /> </head>

<body>
    <div class="logo-container">
        <img src="Resources\utn-logo.png" alt="Logo de la Clínica" class="app-logo">
    </div>
    
    <script>
        try {
            const usuario = JSON.parse(sessionStorage.getItem("usuario"));
            
            if (!usuario || usuario.rol !== "paciente") {
                
                window.location.href = "index.html";
            }
        } catch (e) {            
            window.location.href = "index.html";
        }
    </script>
    
    <header>
        <a id="logoutBtn">
            <button class="secundario">Cerrar sesión</button>
        </a>
    </header>
    

    <main>

        <h2 id="welcomeName">Bienvenido/a</h2>

        <div id="alertContainer"></div>

        <h3>Reservar un turno</h3>

        <form id="reserveForm">

            <div class="form-group">
                <label for="selectDoctor">Seleccione un médico</label>
                <select id="selectDoctor" required></select>
            </div>

            <div class="form-group">
                <label for="date">Seleccione la fecha</label>
                <input type="date" id="date" required />
            </div>

            <div class="form-group">
                <label for="time">Seleccione un horario</label>
                <select id="time" required>
                    <option value="">Seleccione hora</option>
                    <option value="08:00">08:00</option>
                    <option value="09:00">09:00</option>
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                    <option value="16:00">16:00</option>
                </select>
            </div>

            <button type="submit">Solicitar turno</button>

        </form>

        <hr>

        <h3>Mis Turnos</h3>
        <div id="misTurnos" class="turnos-container">
            </div>


    </main>

    <script src="./.js/user.js"></script>
</body>

</html>
