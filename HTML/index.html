<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Turnos Médicos</title>
    <link rel="stylesheet" href="CSS del index.css">
</head>
<body>
    
    <form id="loginForm">
        <h3 id="inicioSesion">Iniciar sesion</h3>

        <div>
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-label" required />
        </div>

        <div>
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" class="form-label" type="password" required />
        </div>
        
        <div>
            <button type="submit">Ingresar</button>
            <a href="register.html">Registrarse</a>
        </div>
        
    </form>
    
</body>
<script src="auth.js"></script> <script src="login.js"></script> </body>
</html>
</html>
