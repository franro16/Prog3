<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sistema de Turnos Médicos</title>
    <link rel="stylesheet" href="CSS de admin.css">

</head>
<body>
   <div id="navContainer">
        <a id="brandLink" href="#">Admin - Clínica</a>
        <div id="navButtons">
            <button id="cerrarSesion">Cerrar sesión</button>
        </div>
    </div>
</nav>

<div id="mainContent">
    <h4>Médicos</h4>
    <div id="doctorCard">
        <form id="doctorForm">
            <input type="hidden" id="doctorId" />
            <div>
                <input id="docNombre" placeholder="Nombre" required />
            </div>

            <div>
                <input id="docEspecialidad" placeholder="Especialidad" required />
            </div>

            <div>
                <input id="docDias" placeholder="Dias disponibles (ej: Lun,Mar)" required />
            </div>

            <div>
                <button id="guardar" type="submit">Guardar</button>
            </div>
        </form>
    </div>

    <div id="listsRow">
        <div>
            <h5>Lista de médicos</h5>
            <ul id="doctorsList"></ul>
        </div>

        <div>
            <h5>Turnos</h5>
        </div>
    </div>
</div>
</body>
</html>
