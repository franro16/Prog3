<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración - Sistema de Turnos Médicos</title>

  <link rel="stylesheet" href=".css/Gral.css" />
  <link rel="stylesheet" href=".css/admin.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <script>
    try {
      const usuario = JSON.parse(sessionStorage.getItem("usuario"));
      if (!usuario || usuario.rol !== "admin") {
        window.location.href = "index.html";
      }
    } catch (e) {
      window.location.href = "index.html";
    }
  </script>

  <header class="header-admin">
    <h1>Administración del Hospital</h1>

    <nav class="nav-admin">
      <button data-section="doctores">👨‍⚕️ Médicos</button>
      <button data-section="turnos">📅 Turnos</button>
      <button data-section="usuarios">👥 Usuarios</button>
      <button data-section="dashboard">📊 Dashboard</button>
      <button id="logoutBtn">Cerrar sesión</button>
    </nav>
  </header>

  <main id="mainContent">

    <section id="seccion-doctores" class="panel-section active">
      <h2>Gestión de Médicos</h2>

      <div id="tarjetaDoctor">
        <form id="doctorForm" autocomplete="off">
          <input type="hidden" id="doctorId" />
          <input id="docNombre" placeholder="Nombre" required />
          <input id="docEspecialidad" placeholder="Especialidad" required />
          <input id="docDias" placeholder="Días disponibles (ej: Lunes,Miércoles)" required />
          <button id="guardarDoctor" type="submit">Guardar</button>
          <button type="button" class="secundario" onclick="document.getElementById('doctorForm').reset(); document.getElementById('doctorId').value='';">Limpiar</button>
        </form>
      </div>

      <article>
        <h3>Lista de Médicos</h3>
        <ul id="listaDoctores"></ul>
      </article>
    </section>

    <section id="seccion-turnos" class="panel-section">
      <h2>Gestión de Turnos</h2>

      <div id="tarjetaTurno">
        <h3>Editar / Crear Turno</h3>
        <form id="turnoForm">
            <input type="hidden" id="turnoId" />

            <div class="form-group">
                <label for="selectPaciente">Paciente</label>
                <select id="selectPaciente" required></select>
            </div>
            
            <div class="form-group">
                <label for="selectDoctorTurno">Médico</label>
                <select id="selectDoctorTurno" required></select>
            </div>

            <div class="form-group">
                <label for="dateTurno">Fecha</label>
                <input type="date" id="dateTurno" required />
            </div>

            <div class="form-group">
                <label for="timeTurno">Horario</label>
                <select id="timeTurno" required>
                </select>
            </div>

            <button id="guardarTurno" type="submit">Guardar Turno</button>
            <button type="button" class="secundario" onclick="document.getElementById('turnoForm').reset(); document.getElementById('turnoId').value=''; document.getElementById('guardarTurno').textContent='Guardar Turno';">Limpiar</button>
        </form>
      </div>

      <article>
        <h3>Lista de Todos los Turnos</h3>
        <ul id="listaTurnos" style="width: 100%;"></ul>
      </article>
    </section>

    <section id="seccion-usuarios" class="panel-section">
      <h2>Gestión de Usuarios</h2>

      <div id="tarjetaPaciente">
        <form id="pacienteForm" autocomplete="off">
  <input type="hidden" id="pacienteId" />
  
  <input id="pacNombre" placeholder="Nombre" required />
  <input id="pacEmail" type="email" placeholder="Correo electrónico" required />
  <input id="pacDni" placeholder="DNI" required />

  <div>
    <label for="pacRol">Rol</label>
    <select id="pacRol" required>
      <option value="paciente">Paciente</option>
      <option value="admin">Admin</option>
    </select>
  </div>

  <div style="display: flex; align-items: center;">
    <input id="pacPassword" type="password" placeholder="Contraseña" required style="flex:1;" />
    <button type="button" id="mostrarPassword" style="margin-left:6px; padding:4px 6px;">🔒</button>
  </div>
  
  <div><button id="guardarPaciente" type="submit">Guardar</button></div>
  <button type="button" class="secundario" onclick="document.getElementById('pacienteForm').reset(); document.getElementById('pacienteId').value='';">Limpiar</button>
</form>
      </div>

      <article>
        <h3>Lista de Usuarios</h3>
        <ul id="listaPacientes" style="width: 100%;"></ul>
      </article>
    </section>

    <section id="seccion-dashboard" class="panel-section">
      <h2>Dashboard de Turnos</h2>
      <div style="display: flex; gap: 30px; justify-content: center; align-items: flex-start;">
          <div id="dashboardInfo" style="min-width: 250px;">
              </div>
          <div style="width: 100%; max-width: 400px; height: 300px;">
              <canvas id="graficoTurnos"></canvas> 
          </div>
      </div>
    </section>

  </main>

  <script src="./.js/admin.js"></script>
</body>
</html>
