<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración - Sistema de Turnos Médicos</title>

  <link rel="stylesheet" href=".css/Gral.css" />
  <link rel="stylesheet" href=".css/admin.css" />
</head>

<body>
  <!-- protección temprana: si no hay sesión o no es admin, redirige -->
  <script>
    try {
      const usuario = JSON.parse(sessionStorage.getItem("usuario"));
      if (!usuario || usuario.rol !== "admin") {
        window.location.href = "index.html";
      }
    } catch (e) {
      window.location.href = "index.html";
    }
  </script>

  <header class="header-admin">
    <h1>Administración del Hospital</h1>

    <nav class="nav-admin">
      <button data-section="doctores">👨‍⚕️ Médicos</button>
      <button data-section="turnos">📅 Turnos</button>
      <button data-section="usuarios">👥 Usuarios</button>
      <button data-section="dashboard">📊 Dashboard</button>
      <button id="logoutBtn">Cerrar sesión</button>
    </nav>
  </header>

  <main id="mainContent">

    <!-- Doctores -->
    <section id="seccion-doctores" class="panel-section active">
      <h2>Médicos</h2>

      <div id="tarjetaDoctor">
        <form id="doctorForm" autocomplete="off">
          <input type="hidden" id="doctorId" />
          <div><input id="docNombre" placeholder="Nombre" required /></div>
          <div><input id="docEspecialidad" placeholder="Especialidad" required /></div>
          <div><input id="docDias" placeholder="Días disponibles (ej: Lun,Mar)" required /></div>
          <div><button id="guardarDoctor" type="submit">Guardar</button></div>
        </form>
      </div>

      <section id="filasListas">
        <article>
          <h3>Lista de Médicos</h3>
          <ul id="listaDoctores"></ul>
        </article>
      </section>
    </section>

    <!-- Turnos -->
    <section id="seccion-turnos" class="panel-section">
      <h2>Gestión de Turnos</h2>

      <div id="tarjetaTurno">
        <form id="turnoForm" autocomplete="off">
          <input type="hidden" id="turnoId" />
          <div><input id="turnoPaciente" placeholder="Paciente" required /></div>
          <div><input id="turnoDoctor" placeholder="Médico" required /></div>
          <div><input id="turnoFecha" type="date" required /></div>
          <div><input id="turnoHora" type="time" required /></div>
          <div><button id="guardarTurno" type="submit">Guardar</button></div>
        </form>
      </div>

      <article>
        <h3>Lista de Turnos</h3>
        <ul id="listaTurnos"></ul>
      </article>
    </section>

    <!-- Usuarios / Pacientes -->
    <section id="seccion-usuarios" class="panel-section">
      <h2>Gestión de Usuarios</h2>

      <div id="tarjetaPaciente">
        <form id="pacienteForm" autocomplete="off">
          <input type="hidden" id="pacienteId" />

          <div><input id="pacNombre" placeholder="Nombre" required /></div>
          <div><input id="pacEmail" type="email" placeholder="Correo electrónico" required /></div>
          <div><input id="pacDni" placeholder="DNI" required /></div>

          <div>
            <label for="pacRol">Rol</label>
            <select id="pacRol" required>
              <option value="paciente">Paciente</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div style="display: flex; align-items: center;">
            <input id="pacPassword" type="password" placeholder="Contraseña" required style="flex:1;" />
            <button type="button" id="mostrarPassword" style="margin-left:6px; padding:4px 6px;">👁️</button>
          </div>

          <div><button id="guardarPaciente" type="submit">Guardar</button></div>
        </form>
      </div>

      <article>
        <h3>Lista de Usuarios</h3>
        <ul id="listaPacientes" style="width: 100%;"></ul>
      </article>
    </section>

    <!-- Dashboard -->
    <section id="seccion-dashboard" class="panel-section">
      <h2>Dashboard de Estadísticas</h2>
      <canvas id="graficoTurnos" width="400" height="200"></canvas>
    </section>

  </main>

  <script src=".js/admin.js"></script>
</body>
</html>
