<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Turnos Médicos</title>
    <link rel="stylesheet" href=".css/Gral.css">
</head>
<body>

    <div class="logo-container">
        <img src="Resources/utn-logo.png" alt="Logo de la Clínica" class="app-logo">
    </div>
    
    <!-- FORMULARIO DE INICIO DE SESIÓN -->
    <form id="loginForm" class="pantalla">
        <h3>Iniciar sesión</h3>

        <div>
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" required>
        </div>

        <div>
            <label for="password">Contraseña</label>
            <input id="password" type="password" required>
        </div>

        <button type="submit">Ingresar</button>

        <p>
            ¿No tenés cuenta?
            <button id="irARegistro" type="button" class="link-btn">Crear una cuenta</button>
        </p>
    </form>

    <!-- FORMULARIO DE REGISTRO -->
    <form id="registroForm" class="pantalla" style="display:none;">
        <h3>Registrarse</h3>

        <div>
            <label for="regNombre">Nombre completo</label>
            <input id="regNombre" required>
        </div>

        <div>
            <label for="regEmail">Correo electrónico</label>
            <input id="regEmail" type="email" required>
        </div>

        <div>
            <label for="regDni">DNI</label>
            <input id="regDni" required>
        </div>

        <div>
            <label for="regPassword">Contraseña</label>
            <input id="regPassword" type="password" required>
        </div>

        <button type="submit">Crear cuenta</button>

        <p>
            ¿Ya tenés cuenta?
            <button id="irALogin" type="button" class="link-btn">Iniciar sesión</button>
        </p>
    </form>

    <div class="creadores">
        <strong>Desarrollado por:</strong>
        Victoria Basso Peretti<br>
        Heredia Agustin<br>
        Romero Franco Isaias<br>
        <strong>ChatGPT y Gemini <br>
        Gracias por tanto, perdón por tan poco</strong>
    </div>

    <!-- JS de login y registro -->
    <script src=".js/index.js"></script>
</body>
</html>
