<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Turnos Médicos</title>
    <link rel="stylesheet" href=".css/Gral.css">
    <style>
        .creadores {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 0.8em;
            color: #777;
            text-align: right;
            line-height: 1.4;
        }
        .creadores strong {
            display: block;
            margin-bottom: 3px;
            font-size: 1em;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="Resources\utn-logo.png" alt="Logo de la Clínica" class="app-logo">
    </div>
    
    <form id="loginForm" class="pantalla">
        <h3>Iniciar sesión</h3>

        <div>
            <label>Email</label>
            <input id="email" type="email" required>
        </div>

        <div>
            <label>Contraseña</label>
            <input id="password" type="password" required>
        </div>

        <button type="submit">Ingresar</button>

        <p>
            ¿No tenés cuenta?
            <button id="irARegistro" type="button" class="link-btn">Crear una cuenta</button>
        </p>
    </form>


    <form id="registroForm" class="pantalla" style="display:none;">
        <h3>Registrarse</h3>

        <div>
            <label>Nombre</label>
            <input id="regNombre" required>
        </div>

        <div>
            <label>Email</label>
            <input id="regEmail" type="email" required>
        </div>

        <div>
            <label>DNI</label>
            <input id="regDni" required>
        </div>

        <div>
            <label>Contraseña</label>
            <input id="regPassword" type="password" required>
        </div>

        <button type="submit">Crear cuenta</button>

        <p>
            ¿Ya tenés cuenta?
            <button id="irALogin" type="button" class="link-btn">Iniciar sesión</button>
        </p>
    </form>

    <div class="creadores">
        <strong>Desarrollado por:</strong>
        Victoria Basso Peretti<br>
        Heredia Agustin<br>
        Romero Franco Isaias
        <strong>ChatGPT y Gemini
            <br>Gracias por tanto, perdon por tan poco</strong>
    </div>

    <script src=".js/index.js"></script>
</body>
</html>
